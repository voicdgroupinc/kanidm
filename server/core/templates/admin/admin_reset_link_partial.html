<div class="alert alert-info mt-3 mb-0">
    <label class="fw-bold d-block mb-1">Password-reset link</label>
    <input type="text" class="form-control" readonly value="(( link ))"
           aria-label="Credential reset link">
    <div class="mt-1">
        <a href="(( link ))" target="_blank" rel="noopener">Open reset link</a>
    </div>
    <small class="text-body-secondary">Share this with the user. It lets them set their own
        password or passkey and expires after a short time.</small>
</div>
