<div class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">
    <span class="text-body-secondary small">
        Showing (( pager.from_row() ))–(( pager.to_row() )) of (( pager.total ))
    </span>
    <div class="btn-group">
        (% if pager.has_prev() %)
        <a class="btn btn-outline-secondary btn-sm"
           href="(( base_path ))(( pager.page_link(pager.prev_page()) ))"
           hx-get="(( base_path ))(( pager.page_link(pager.prev_page()) ))"
           hx-target="#main" hx-push-url="true">Prev</a>
        (% else %)
        <button class="btn btn-outline-secondary btn-sm" disabled>Prev</button>
        (% endif %)
        <span class="btn btn-outline-secondary btn-sm disabled">Page (( pager.page )) / (( pager.total_pages() ))</span>
        (% if pager.has_next() %)
        <a class="btn btn-outline-secondary btn-sm"
           href="(( base_path ))(( pager.page_link(pager.next_page()) ))"
           hx-get="(( base_path ))(( pager.page_link(pager.next_page()) ))"
           hx-target="#main" hx-push-url="true">Next</a>
        (% else %)
        <button class="btn btn-outline-secondary btn-sm" disabled>Next</button>
        (% endif %)
    </div>
</div>
