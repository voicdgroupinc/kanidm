(% extends "admin/admin_partial_base.html" %)

(% block groups_item_extra_classes %)active(% endblock %)

(% block admin_page %)
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="/ui/admin/groups" hx-target="#main">Group List</a></li>
        <li class="breadcrumb-item active" aria-current="page">Create Group</li>
    </ol>
</nav>

(% if can_rw %)
<form id="create_group_container" class="needs-validation col-12 col-md-8 col-lg-6"
      hx-post="/ui/api/admin/groups"
      hx-target=".toast-container"
      hx-swap="beforeend"
      hx-validate="true"
      hx-ext="bs-validation"
      novalidate>
    <div class="mb-3">
        <label for="create-group-name" class="form-label fw-bold">Name</label>
        <input type="text" class="form-control" id="create-group-name" name="name" required
               autocomplete="off" placeholder="my_group">
    </div>
    <div class="mb-3">
        <label for="create-group-description" class="form-label fw-bold">Description
            <span class="fw-normal text-body-secondary">(optional)</span></label>
        <input type="text" class="form-control" id="create-group-description" name="description"
               autocomplete="off" placeholder="What this group is for">
    </div>
    <button type="submit" class="btn btn-primary">Create group</button>
    <a href="/ui/admin/groups" hx-target="#main" class="btn btn-secondary">Cancel</a>
</form>
(% else %)
<p>Your session must be unlocked before you can create a group.</p>
<a href="/ui/unlock" class="btn btn-secondary">Unlock Edit 🔒</a>
(% endif %)

<div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>
(% endblock %)
