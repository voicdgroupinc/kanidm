---
name: Linting checks

# Trigger the workflow on push
"on":
  push:
  pull_request:

env:
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install dependencies
        run: |
          sudo apt-get update && \
          sudo apt-get install -y \
            libpam0g-dev \
            libselinux1-dev \
            libssl-dev \
            libsystemd-dev \
            libtss2-dev \
            libudev-dev \
            pkg-config \
            libtalloc-dev \
            tpm-udev
      - name: "Run clippy"
        # Voicd fork: scoped to the crates this fork actually changes.
        # rust-toolchain.toml pins `channel = "stable"`, a moving target, and
        # newer clippy releases trip result_large_err / result_unit_err in
        # upstream crates that carry `#![deny(warnings)]` - kanidm_tools and
        # sparkle_resolver_common today. Upstream's own lint CI is red for the
        # same reason, so a full-workspace run here reports upstream's problems
        # and buries ours. Add a crate here if the fork starts modifying it.
        run: |
          rustup component add clippy
          cargo clippy --quiet --lib --bins --examples \
            -p kanidmd_core -p kanidmd_lib -p kanidm_proto
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: "Run cargo fmt"
        run: |
          rustup component add rustfmt
          cargo fmt --check
